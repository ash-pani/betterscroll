                        <div className="flex gap-1.5">
                          <button disabled={safeIdx === 0} onClick={() => setCurrentReelIdx((p) => Math.max(0, p - 1))} className="px-2.5 py-1 rounded border border-zinc-800 bg-zinc-900 text-zinc-400 disabled:opacity-30">prev</button>
                          <button onClick={() => { if (safeIdx < displayedReels.length - 1) setCurrentReelIdx((p) => p + 1); else handleRefresh(selectedCategory); }} className="px-2.5 py-1 rounded border border-zinc-700 bg-zinc-800 text-zinc-200">{safeIdx < displayedReels.length - 1 ? "next" : "load more"}</button>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })()}
              {activeTab === "vault" && (
                <div className="p-4 space-y-3">
                  <div className="flex items-center justify-between border-b border-zinc-900 pb-2.5">
                    <div><div className="text-xs text-zinc-200 font-medium">saved notes ({savedCount})</div><div className="text-[11px] text-zinc-500">{learnedCount} marked read</div></div>
                    {savedCount > 0 && <button onClick={handleSynthesizeVault} className="px-2.5 py-1 rounded border border-zinc-800 bg-zinc-900 text-zinc-300 text-[11px]">{isSynthesizingVault ? "synthesizing..." : "synthesize links"}</button>}
                  </div>
                  {vaultSynthesis && <div className="p-3 rounded border border-zinc-800 bg-[#111114] text-xs font-sans whitespace-pre-line text-zinc-300">{vaultSynthesis}</div>}
                  {savedCount === 0 ? <div className="p-8 text-center text-zinc-500">No saved notes yet.</div> : (
                    <div className="space-y-2">
                      {posts.filter((p) => p.saved).map((p) => <div key={p.id} className="p-3 rounded border border-zinc-800 bg-[#111114] flex justify-between items-center"><div><div className="text-[10px] text-zinc-500">{p.category} · {p.country}</div><div className="text-xs text-zinc-200">{p.headline}</div></div><button onClick={() => setPosts((prev) => prev.map((x) => x.id === p.id ? { ...x, saved: false } : x))} className="text-[11px] text-zinc-500">remove</button></div>)}
                      {reels.filter((r) => r.saved).map((r) => <div key={r.id} className="p-3 rounded border border-zinc-800 bg-[#111114] flex justify-between items-center"><div><div className="text-[10px] text-zinc-500">stream · {r.category}</div><div className="text-xs text-zinc-200">{r.title}</div></div><button onClick={() => setReels((prev) => prev.map((x) => x.id === r.id ? { ...x, saved: false } : x))} className="text-[11px] text-zinc-500">remove</button></div>)}
                    </div>
                  )}
                </div>
              )}
              {activeTab === "config" && (
                <div className="p-4 space-y-4">
                  <div className="p-3.5 rounded border border-zinc-800 bg-[#111114] space-y-2.5">
                    <div className="flex items-center justify-between"><span className="text-xs font-medium text-zinc-200">live intelligence engine (github pages)</span><span className="text-[10px] text-emerald-400">{geminiKey.trim() ? "gemini-3-flash + search active" : "open-research live wire active"}</span></div>
                    <p className="text-[11px] text-zinc-400 font-sans leading-relaxed">Refresh & Live Wire work out-of-the-box via real-time HN Algolia / open research dispatches. Add a Gemini API key below (saved in your browser localStorage) to unlock Gemini 3 Flash synthesis, Google Search Grounding, and Neural TTS on this GitHub link.</p>
                    <input type="password" value={geminiKey} onChange={(e) => { setGeminiKey(e.target.value); localStorage.setItem("betterscroll_gemini_key", e.target.value); }} placeholder="optional Gemini API key (AIza...)" className="w-full bg-[#0a0a0c] border border-zinc-800 rounded px-2.5 py-1.5 text-xs text-zinc-200" />
                  </div>
                  <div className="p-3.5 rounded border border-zinc-800 bg-[#111114] flex items-center justify-between">
                    <span className="text-xs text-zinc-200">domain channels ({categories.length})</span>
                    <button onClick={() => setShowDomainManager(true)} className="px-2.5 py-1 rounded border border-zinc-800 bg-zinc-900 text-zinc-300 text-xs">edit channels</button>
                  </div>
                  <div className="p-3.5 rounded border border-zinc-800 bg-[#111114] flex items-center justify-between">
                    <span className="text-xs text-zinc-200">session timer</span>
                    <div className="flex gap-1.5"><button onClick={() => setSecondsLeft(600)} className="px-2.5 py-1 rounded border border-zinc-800 bg-zinc-900 text-zinc-300">10m</button><button onClick={() => setSecondsLeft(300)} className="px-2.5 py-1 rounded border border-zinc-800 bg-zinc-900 text-zinc-300">5m</button></div>
                  </div>
                </div>
              )}
            </main>
            <nav className="sticky bottom-0 z-30 bg-[#0d0d0f] border-t border-zinc-900 px-6 py-2.5 flex justify-between text-xs">
              <button onClick={() => setActiveTab("feed")} className={activeTab === "feed" ? "text-zinc-100 font-medium" : "text-zinc-500"}>feed</button>
              <button onClick={() => setActiveTab("stream")} className={activeTab === "stream" ? "text-zinc-100 font-medium" : "text-zinc-500"}>stream</button>
              <button onClick={() => setActiveTab("vault")} className={activeTab === "vault" ? "text-zinc-100 font-medium" : "text-zinc-500"}>saved {savedCount > 0 ? "(" + savedCount + ")" : ""}</button>
              <button onClick={() => setActiveTab("config")} className={activeTab === "config" ? "text-zinc-100 font-medium" : "text-zinc-500"}>git / config</button>
            </nav>
            {activeStoryIndex !== null && stories[activeStoryIndex] && (() => {
              const st = stories[activeStoryIndex];
              const sl = st.slides[activeStorySlide] || st.slides[0];
              return (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                  <div className="w-full max-w-md bg-[#111114] border border-zinc-800 rounded p-4 space-y-4">
                    <div className="flex justify-between border-b border-zinc-800 pb-2 text-[11px] text-zinc-500"><span>{st.category} · {st.title}</span><button onClick={() => setActiveStoryIndex(null)}>close</button></div>
                    <div className="space-y-3"><h3 className="text-sm font-medium text-zinc-100">{sl.headline}</h3><p className="text-xs text-zinc-300 font-sans leading-relaxed">{sl.body}</p><div className="p-2.5 rounded bg-[#0d0d0f] border border-zinc-800"><span className="text-[10px] text-zinc-500 block">metric</span><div className="text-zinc-200 font-medium">{sl.stat}</div></div><div className="p-2.5 rounded bg-[#0d0d0f] border border-zinc-800"><span className="text-[10px] text-zinc-500 block">takeaway</span><div className="text-zinc-300 font-sans">{sl.takeaway}</div></div></div>
                    <div className="flex justify-between pt-2 border-t border-zinc-800 text-[11px]">
                      <button disabled={activeStorySlide === 0} onClick={() => setActiveStorySlide((p) => Math.max(0, p - 1))} className="text-zinc-400 disabled:opacity-30">prev</button>
                      <span className="text-zinc-500">{activeStorySlide + 1} / {st.slides.length}</span>
                      <button onClick={() => { if (activeStorySlide < st.slides.length - 1) setActiveStorySlide((p) => p + 1); else setActiveStoryIndex(null); }} className="text-zinc-200 font-medium">next</button>
                    </div>
                  </div>
                </div>
              );
            })()}
            {showDomainManager && (
              <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                <div className="w-full max-w-sm bg-[#111114] border border-zinc-800 rounded p-4 space-y-3">
                  <div className="flex justify-between border-b border-zinc-800 pb-2 text-xs"><span className="font-medium text-zinc-200">domain channels</span><button onClick={() => setShowDomainManager(false)} className="text-zinc-500">close</button></div>
                  <div className="flex gap-1.5"><input type="text" value={newDomainName} onChange={(e) => setNewDomainName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") handleAddDomain(); }} placeholder="add domain..." className="flex-1 bg-[#0a0a0c] border border-zinc-800 rounded px-2.5 py-1.5 text-xs text-zinc-200" /><button onClick={handleAddDomain} className="px-3 py-1.5 rounded bg-zinc-800 text-zinc-200 text-xs">add</button></div>
                  <div className="space-y-1 max-h-48 overflow-y-auto">{categories.map((c) => <div key={c.id} className="flex justify-between px-2.5 py-1.5 rounded bg-[#0d0d0f] border border-zinc-800/60 text-xs"><span>{c.name}</span>{c.removable ? <button onClick={() => setCategories((p) => p.filter((x) => x.id !== c.id))} className="text-zinc-500 hover:text-red-400">remove</button> : <span className="text-zinc-600 text-[10px]">default</span>}</div>)}</div>
                </div>
              </div>
            )}
            {showVerificationModal && (
              <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                <div className="w-full max-w-sm bg-[#111114] border border-zinc-800 rounded p-4 space-y-3 text-xs">
                  <div className="flex justify-between border-b border-zinc-800 pb-2"><span className="font-medium text-zinc-200">verification methodology</span><button onClick={() => setShowVerificationModal(false)} className="text-zinc-500">close</button></div>
                  <p className="text-zinc-400 font-sans leading-relaxed">Verification scores reflect independent primary sources (regulatory filings, central banks, peer-reviewed journals) reporting consistent quantitative figures.</p>
                </div>
              </div>
            )}
            {showSessionCompleteModal && (
              <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                <div className="w-full max-w-sm bg-[#111114] border border-zinc-800 rounded p-4 text-center space-y-3">
                  <div className="text-zinc-200 text-xs font-medium">10m session complete</div>
                  <p className="text-xs text-zinc-400 font-sans">You read {learnedCount} notes and saved {savedCount} items.</p>
                  <div className="flex gap-2 pt-1"><button onClick={() => { setSecondsLeft(600); setShowSessionCompleteModal(false); }} className="flex-1 py-1.5 rounded bg-zinc-800 text-zinc-200 text-xs">+10m</button><button onClick={() => setShowSessionCompleteModal(false)} className="flex-1 py-1.5 rounded border border-zinc-800 text-zinc-400 text-xs">dismiss</button></div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<StandaloneApp />);
  </script>
</body>
</html>
