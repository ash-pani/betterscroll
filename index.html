            html += `    <div class="p-2.5 rounded bg-[#0d0d0f] border border-zinc-800/70 flex justify-between text-[11px]"><span class="text-zinc-500">key metric</span><span class="text-zinc-200 font-medium">${reel.keyMetric}</span></div>`;
            html += `    <div class="p-2.5 rounded bg-[#0d0d0f] border border-zinc-800/70 space-y-1"><span class="text-[10px] text-zinc-500 block">mental model</span><p class="text-xs text-zinc-200 font-sans">${reel.mentalModel}</p></div>`;
            html += `    <div class="flex items-center justify-between pt-2 border-t border-zinc-800 text-[11px]">`;
            html += `      <div class="flex items-center gap-3">`;
            html += `        <button onclick="BetterScroll.toggleLearnedReel('${reel.id}')" class="${reel.learned ? "text-emerald-400 font-medium" : "text-zinc-500"}">${reel.learned ? "✓ read" : "mark read"}</button>`;
            html += `        <button onclick="BetterScroll.listen('${reel.id}', '${(reel.title + ". " + reel.hook + ". " + reel.bullets.join(" ")).replace(/'/g, "\\'")}')" class="text-zinc-500">${state.playingId === reel.id ? "stop" : "listen"}</button>`;
            html += `        <button onclick="BetterScroll.toggleSaveReel('${reel.id}')" class="${reel.saved ? "text-zinc-100 font-medium" : "text-zinc-500"}">${reel.saved ? "★ saved" : "save"}</button>`;
            html += `      </div>`;
            html += `      <div class="flex gap-1.5">`;
            html += `        <button ${rIdx === 0 ? "disabled" : ""} onclick="state.currentReelIdx = Math.max(0, state.currentReelIdx - 1); render();" class="px-2.5 py-1 rounded border border-zinc-800 bg-zinc-900 text-zinc-400 disabled:opacity-30">prev</button>`;
            html += `        <button onclick="if(state.currentReelIdx < displayedReels.length - 1){ state.currentReelIdx++; render(); } else { BetterScroll.refresh(state.selectedCategory); }" class="px-2.5 py-1 rounded border border-zinc-700 bg-zinc-800 text-zinc-200">${rIdx < displayedReels.length - 1 ? "next" : "load more"}</button>`;
            html += `      </div>`;
            html += `    </div>`;
            html += `  </div>`;
            html += `</div>`;
          }
        } else if (state.activeTab === "vault") {
          html += `<div class="p-4 space-y-3">`;
          html += `  <div class="flex items-center justify-between border-b border-zinc-900 pb-2.5">`;
          html += `    <div><div class="text-xs text-zinc-200 font-medium">saved notes (${savedCount})</div><div class="text-[11px] text-zinc-500">${learnedCount} marked read</div></div>`;
          if (savedCount > 0) {
            html += `    <button onclick="BetterScroll.synthesizeVault()" class="px-2.5 py-1 rounded border border-zinc-800 bg-zinc-900 text-zinc-300 text-[11px]">synthesize links</button>`;
          }
          html += `  </div>`;
          if (state.vaultSynthesis) {
            html += `  <div class="p-3 rounded border border-zinc-800 bg-[#111114] text-xs font-sans whitespace-pre-line text-zinc-300 space-y-2"><div class="flex justify-between text-zinc-500 border-b border-zinc-800 pb-1"><span>synthesis</span><button onclick="BetterScroll.closeVaultSynthesis()">close</button></div><div>${state.vaultSynthesis}</div></div>`;
          }
          if (savedCount === 0) {
            html += `  <div class="p-8 text-center text-zinc-500">No saved notes yet.</div>`;
          } else {
            html += `  <div class="space-y-2">`;
            state.posts.filter(p => p.saved).forEach(p => {
              html += `    <div class="p-3 rounded border border-zinc-800 bg-[#111114] flex justify-between items-center"><div><div class="text-[10px] text-zinc-500">${p.category} · ${p.country}</div><div class="text-xs text-zinc-200">${p.headline}</div></div><button onclick="BetterScroll.toggleSavePost('${p.id}')" class="text-[11px] text-zinc-500">remove</button></div>`;
            });
            state.reels.filter(r => r.saved).forEach(r => {
              html += `    <div class="p-3 rounded border border-zinc-800 bg-[#111114] flex justify-between items-center"><div><div class="text-[10px] text-zinc-500">stream · ${r.category}</div><div class="text-xs text-zinc-200">${r.title}</div></div><button onclick="BetterScroll.toggleSaveReel('${r.id}')" class="text-[11px] text-zinc-500">remove</button></div>`;
            });
            html += `  </div>`;
          }
          html += `</div>`;
        } else if (state.activeTab === "config") {
          html += `<div class="p-4 space-y-4">`;
          html += `  <div class="p-3.5 rounded border border-zinc-800 bg-[#111114] space-y-2">`;
          html += `    <span class="text-xs font-medium text-zinc-200 block">github live web app active</span>`;
          html += `    <p class="text-[11px] text-zinc-400 font-sans leading-relaxed">This standalone app runs directly from your GitHub repository (<code>ash-pani/betterscroll</code>) with real-time research dispatches, multi-slide carousels, and persistent reading memory.</p>`;
          html += `  </div>`;
          html += `  <div class="p-3.5 rounded border border-zinc-800 bg-[#111114] flex items-center justify-between"><span class="text-xs text-zinc-200">domain channels (${state.categories.length})</span><button onclick="BetterScroll.openDomains()" class="px-2.5 py-1 rounded border border-zinc-800 bg-zinc-900 text-zinc-300 text-xs">edit channels</button></div>`;
          html += `  <div class="p-3.5 rounded border border-zinc-800 bg-[#111114] flex items-center justify-between"><span class="text-xs text-zinc-200">focus timer</span><div class="flex gap-1.5"><button onclick="state.secondsLeft = 600; render();" class="px-2.5 py-1 rounded border border-zinc-800 bg-zinc-900 text-zinc-300">10m</button><button onclick="state.secondsLeft = 300; render();" class="px-2.5 py-1 rounded border border-zinc-800 bg-zinc-900 text-zinc-300">5m</button></div></div>`;
          html += `</div>`;
        }
        html += `</main>`;
        html += `<nav class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-[#0d0d0f] border-t border-zinc-900 px-6 py-2.5 flex justify-between text-xs z-30">`;
        html += `  <button onclick="BetterScroll.setTab('feed')" class="${state.activeTab === "feed" ? "text-zinc-100 font-medium" : "text-zinc-500"}">feed</button>`;
        html += `  <button onclick="BetterScroll.setTab('stream')" class="${state.activeTab === "stream" ? "text-zinc-100 font-medium" : "text-zinc-500"}">stream</button>`;
        html += `  <button onclick="BetterScroll.setTab('vault')" class="${state.activeTab === "vault" ? "text-zinc-100 font-medium" : "text-zinc-500"}">saved ${savedCount > 0 ? "(" + savedCount + ")" : ""}</button>`;
        html += `  <button onclick="BetterScroll.setTab('config')" class="${state.activeTab === "config" ? "text-zinc-100 font-medium" : "text-zinc-500"}">git / config</button>`;
        html += `</nav>`;
        if (state.activeStoryIdx !== null && state.stories[state.activeStoryIdx]) {
          const st = state.stories[state.activeStoryIdx];
          const sl = st.slides[state.activeStorySlide] || st.slides[0];
          html += `<div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">`;
          html += `  <div class="w-full max-w-md bg-[#111114] border border-zinc-800 rounded p-4 space-y-4">`;
          html += `    <div class="flex justify-between border-b border-zinc-800 pb-2 text-[11px] text-zinc-500"><span>${st.category} · ${st.title}</span><button onclick="BetterScroll.closeStory()">close</button></div>`;
          html += `    <div class="space-y-3"><h3 class="text-sm font-medium text-zinc-100">${sl.headline}</h3><p class="text-xs text-zinc-300 font-sans leading-relaxed">${sl.body}</p><div class="p-2.5 rounded bg-[#0d0d0f] border border-zinc-800"><span class="text-[10px] text-zinc-500 block">metric</span><div class="text-zinc-200 font-medium">${sl.stat}</div></div><div class="p-2.5 rounded bg-[#0d0d0f] border border-zinc-800"><span class="text-[10px] text-zinc-500 block">takeaway</span><div class="text-zinc-300 font-sans">${sl.takeaway}</div></div></div>`;
          html += `    <div class="flex justify-between pt-2 border-t border-zinc-800 text-[11px]">`;
          html += `      <button ${state.activeStorySlide === 0 ? "disabled" : ""} onclick="BetterScroll.storySlide(-1)" class="text-zinc-400 disabled:opacity-30">prev</button>`;
          html += `      <span class="text-zinc-500">${state.activeStorySlide + 1} / ${st.slides.length}</span>`;
          html += `      <button onclick="BetterScroll.storySlide(1)" class="text-zinc-200 font-medium">next</button>`;
          html += `    </div>`;
          html += `  </div>`;
          html += `</div>`;
        }
        if (state.showDomainModal) {
          html += `<div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">`;
          html += `  <div class="w-full max-w-sm bg-[#111114] border border-zinc-800 rounded p-4 space-y-3">`;
          html += `    <div class="flex justify-between border-b border-zinc-800 pb-2 text-xs"><span class="font-medium text-zinc-200">domain channels</span><button onclick="BetterScroll.closeDomains()" class="text-zinc-500">close</button></div>`;
          html += `    <div class="flex gap-1.5"><input type="text" id="domain-input" placeholder="add domain..." class="flex-1 bg-[#0a0a0c] border border-zinc-800 rounded px-2.5 py-1.5 text-xs text-zinc-200 focus:outline-none" /><button onclick="BetterScroll.addDomain(document.getElementById('domain-input').value)" class="px-3 py-1.5 rounded bg-zinc-800 text-zinc-200 text-xs">add</button></div>`;
          html += `    <div class="space-y-1 max-h-48 overflow-y-auto">`;
          state.categories.forEach(c => {
            html += `      <div class="flex justify-between px-2.5 py-1.5 rounded bg-[#0d0d0f] border border-zinc-800/60 text-xs"><span>${c.name}</span>${c.removable ? `<button onclick="BetterScroll.removeDomain('${c.id}')" class="text-zinc-500 hover:text-red-400">remove</button>` : `<span class="text-zinc-600 text-[10px]">default</span>`}</div>`;
          });
          html += `    </div>`;
          html += `  </div>`;
          html += `</div>`;
        }
        if (state.showMethodology) {
          html += `<div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">`;
          html += `  <div class="w-full max-w-sm bg-[#111114] border border-zinc-800 rounded p-4 space-y-3 text-xs">`;
          html += `    <div class="flex justify-between border-b border-zinc-800 pb-2"><span class="font-medium text-zinc-200">verification methodology</span><button onclick="BetterScroll.closeMethodology()" class="text-zinc-500">close</button></div>`;
          html += `    <p class="text-zinc-400 font-sans leading-relaxed">Verification scores reflect independent primary source consensus (regulatory agencies, central banks, and peer-reviewed journals) reporting matching quantitative metrics.</p>`;
          html += `  </div>`;
          html += `</div>`;
        }
        root.innerHTML = html;
      }
      window.onload = render;
    })();
  </script>
</body>
</html>
